name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, [self-hosted, macOS, ARM64]]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "file:./prod.db"
          AUTH_SECRET: "placeholder-secret"

      - name: Create standalone package
        run: |
          mkdir -p release
          cp -r .next release/
          cp -r public release/
          cp -r prisma release/
          cp package.json release/
          cp package-lock.json release/
          cp .env.example release/.env.example
          cd release && tar -czf ../stowaway-${{ github.ref_name }}.tar.gz .

      - name: Create GitHub Release
        if: matrix.runner == 'ubuntu-latest'
        uses: softprops/action-gh-release@v1
        with:
          files: stowaway-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
